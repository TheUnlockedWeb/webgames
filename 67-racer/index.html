<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>67 RACER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --black: #070707;
        --dark: #111111;
        --mid: #1a1a1a;
        --orange: #ff5200;
        --orange2: #ff8c00;
        --glow: rgba(255, 82, 0, 0.45);
        --glow2: rgba(255, 82, 0, 0.15);
        --white: #f5f5f5;
        --gray: #444;
        --lgray: #888;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--black);
        color: var(--white);
        font-family: "IBM Plex Mono", monospace;
        overflow: hidden;
      }

      /* ── PAGE SYSTEM ── */
      .page {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .page.active {
        display: flex;
      }

      /* ── SHARED BUTTON ── */
      .btn {
        font-family: "Orbitron", sans-serif;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border: 2px solid var(--orange);
        background: transparent;
        color: var(--orange);
        padding: 14px 38px;
        font-size: 0.85rem;
        cursor: pointer;
        position: relative;
        clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
        transition:
          background 0.18s,
          color 0.18s,
          box-shadow 0.18s;
      }
      .btn:hover {
        background: var(--orange);
        color: var(--black);
        box-shadow: 0 0 24px var(--glow);
      }
      .btn.secondary {
        border-color: var(--gray);
        color: var(--lgray);
      }
      .btn.secondary:hover {
        background: var(--gray);
        color: var(--white);
        box-shadow: none;
      }

      /* ── NOISE OVERLAY ── */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 200px;
        pointer-events: none;
        opacity: 0.5;
      }

      /* ══════════════════════════════════════
       HOME PAGE
    ══════════════════════════════════════ */
      #page-home {
        gap: 0;
        background:
          radial-gradient(
            ellipse 60% 40% at 50% 110%,
            rgba(255, 82, 0, 0.18) 0%,
            transparent 70%
          ),
          var(--black);
      }

      .home-logo {
        width: min(300px, 72vw);
        max-width: 340px;
        max-height: 220px;
        display: block;
        margin: 0 auto 72px;
        animation: none;
      }
      .home-logo img {
        width: 100%;
        height: auto;
        display: block;
      }

      @keyframes pulse-glow {
        from {
          text-shadow:
            0 0 40px var(--glow),
            0 0 80px var(--glow2);
        }
        to {
          text-shadow:
            0 0 80px rgba(255, 82, 0, 0.7),
            0 0 160px var(--glow);
        }
      }

      .home-sub {
        font-family: "Orbitron", sans-serif;
        font-weight: 400;
        font-size: clamp(0.7rem, 2vw, 1rem);
        letter-spacing: 0.5em;
        color: var(--orange2);
        margin-top: 72px;
        margin-bottom: 42px;
        opacity: 0.8;
      }

      .home-tagline {
        font-size: 0.78rem;
        letter-spacing: 0.15em;
        color: var(--lgray);
        text-transform: uppercase;
        margin-bottom: 36px;
      }

      #username-input {
        font-family: "Orbitron", sans-serif;
        font-weight: 700;
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        text-align: center;
        text-transform: uppercase;
        width: 320px;
        background: var(--mid);
        border: 2px solid var(--gray);
        color: var(--white);
        padding: 14px 20px;
        margin-bottom: 20px;
        outline: none;
        clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      #username-input::placeholder {
        color: var(--gray);
      }
      #username-input:focus {
        border-color: var(--orange);
        box-shadow: 0 0 16px var(--glow2);
      }

      .home-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        width: 320px;
      }

      .home-rule {
        width: 320px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--gray),
          transparent
        );
        margin: 28px 0 24px;
      }

      .rules-text {
        font-size: 0.7rem;
        color: var(--lgray);
        letter-spacing: 0.08em;
        text-align: center;
        line-height: 1.9;
        max-width: 320px;
      }

      /* ══════════════════════════════════════
       GAME PAGE
    ══════════════════════════════════════ */
      #page-game {
        background: #000;
      }

      #webcam {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
      }

      #hand-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: scaleX(-1);
        pointer-events: none;
      }

      /* Scanline effect */
      #page-game::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.12) 2px,
          rgba(0, 0, 0, 0.12) 4px
        );
        pointer-events: none;
        z-index: 10;
      }

      /* Dark vignette */
      #page-game::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 80% 80% at 50% 50%,
          transparent 50%,
          rgba(0, 0, 0, 0.7) 100%
        );
        pointer-events: none;
        z-index: 10;
      }

      /* HUD */
      #game-hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 28px 36px;
        z-index: 20;
      }

      .hud-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 82, 0, 0.35);
        padding: 12px 28px 10px;
        clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
        backdrop-filter: blur(6px);
      }

      .hud-label {
        font-family: "Orbitron", sans-serif;
        font-size: 0.55rem;
        letter-spacing: 0.35em;
        color: var(--orange);
        margin-bottom: 2px;
      }

      .hud-value {
        font-family: "Orbitron", sans-serif;
        font-weight: 900;
        font-size: 2.8rem;
        line-height: 1;
        color: var(--white);
        text-shadow: 0 0 20px var(--glow);
        font-variant-numeric: tabular-nums;
      }

      #hud-timer.warning .hud-value {
        color: var(--orange);
        animation: blink 0.5s step-end infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.3;
        }
      }

      /* Countdown overlay */
      #countdown-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 30;
        background: rgba(0, 0, 0, 0.5);
      }
      #countdown-overlay.hidden {
        display: none;
      }

      #countdown-num {
        font-family: "Orbitron", sans-serif;
        font-weight: 900;
        font-size: clamp(8rem, 22vw, 18rem);
        color: transparent;
        -webkit-text-stroke: 4px var(--orange);
        text-shadow: 0 0 80px var(--glow);
        animation: cd-pop 0.4s ease-out;
      }
      @keyframes cd-pop {
        from {
          transform: scale(1.6);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Flash effect on the score count */
      .hud-block .hud-value {
        transition:
          color 0.15s,
          text-shadow 0.15s,
          transform 0.15s;
      }

      #hud-count.flash .hud-value {
        color: #ffffff;
        text-shadow:
          0 0 24px var(--orange),
          0 0 48px rgba(255, 82, 0, 0.65);
        transform: scale(1.08);
      }

      #hud-count.flash {
        box-shadow: 0 0 26px rgba(255, 82, 0, 0.22);
      }

      /* Loading screen */
      #loading-screen {
        position: absolute;
        inset: 0;
        background: var(--black);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 40;
        gap: 20px;
      }
      #loading-screen.hidden {
        display: none;
      }
      .loader-text {
        font-family: "Orbitron", sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.3em;
        color: var(--orange);
        animation: blink 1s step-end infinite;
      }
      .loader-bar {
        width: 200px;
        height: 2px;
        background: var(--gray);
        position: relative;
        overflow: hidden;
      }
      .loader-bar::after {
        content: "";
        position: absolute;
        left: -60%;
        top: 0;
        width: 60%;
        height: 100%;
        background: var(--orange);
        animation: slide-bar 1.2s ease-in-out infinite;
      }
      @keyframes slide-bar {
        0% {
          left: -60%;
        }
        100% {
          left: 110%;
        }
      }

      /* ══════════════════════════════════════
       RESULTS PAGE
    ══════════════════════════════════════ */
      #page-results {
        background:
          radial-gradient(
            ellipse 50% 40% at 50% 0%,
            rgba(255, 82, 0, 0.12) 0%,
            transparent 60%
          ),
          var(--black);
        overflow-y: auto;
        justify-content: flex-start;
        padding: 48px 24px 60px;
      }

      .results-header {
        font-family: "Orbitron", sans-serif;
        font-size: 0.65rem;
        letter-spacing: 0.5em;
        color: var(--orange);
        text-transform: uppercase;
        margin-bottom: 4px;
        text-align: center;
      }

      .results-score-block {
        text-align: center;
        margin-bottom: 32px;
      }

      .results-score-big {
        font-family: "Orbitron", sans-serif;
        font-weight: 900;
        font-size: clamp(5rem, 16vw, 10rem);
        line-height: 1;
        color: transparent;
        -webkit-text-stroke: 3px var(--orange);
        text-shadow: 0 0 60px var(--glow);
      }

      .results-score-label {
        font-size: 0.7rem;
        letter-spacing: 0.3em;
        color: var(--lgray);
        text-transform: uppercase;
      }

      .results-rank-badge {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        border: 1px solid var(--orange);
        padding: 10px 24px;
        margin: 0 auto 36px;
        clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
        background: rgba(255, 82, 0, 0.08);
      }

      .rank-label {
        font-family: "Orbitron", sans-serif;
        font-size: 0.6rem;
        letter-spacing: 0.3em;
        color: var(--lgray);
      }

      .rank-value {
        font-family: "Orbitron", sans-serif;
        font-weight: 900;
        font-size: 1.6rem;
        color: var(--orange);
        text-shadow: 0 0 20px var(--glow);
      }

      .chart-container {
        width: 100%;
        max-width: 680px;
        margin: 0 auto 36px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 82, 0, 0.2);
        padding: 20px 20px 10px;
      }

      .chart-title {
        font-size: 0.62rem;
        letter-spacing: 0.25em;
        color: var(--lgray);
        text-transform: uppercase;
        margin-bottom: 14px;
      }

      .results-buttons {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
      }

      /* ══════════════════════════════════════
       LEADERBOARD PAGE
    ══════════════════════════════════════ */
      #page-leaderboard {
        background:
          radial-gradient(
            ellipse 40% 30% at 50% 100%,
            rgba(255, 82, 0, 0.1) 0%,
            transparent 60%
          ),
          var(--black);
        overflow-y: auto;
        justify-content: flex-start;
        padding: 48px 24px 60px;
      }

      .lb-header {
        font-family: "Orbitron", sans-serif;
        font-weight: 900;
        font-size: clamp(1.8rem, 6vw, 3.5rem);
        letter-spacing: 0.08em;
        color: transparent;
        -webkit-text-stroke: 2px var(--orange);
        text-align: center;
        margin-bottom: 40px;
      }

      .lb-table {
        width: 100%;
        max-width: 640px;
        margin: 0 auto 36px;
        border-collapse: collapse;
      }

      .lb-table th {
        font-family: "Orbitron", sans-serif;
        font-size: 0.58rem;
        letter-spacing: 0.3em;
        color: var(--orange);
        text-align: left;
        padding: 10px 16px;
        border-bottom: 1px solid rgba(255, 82, 0, 0.3);
      }

      .lb-table td {
        font-size: 0.82rem;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        color: var(--white);
        font-variant-numeric: tabular-nums;
      }

      .lb-table tr:hover td {
        background: rgba(255, 82, 0, 0.06);
      }

      .lb-rank {
        font-family: "Orbitron", sans-serif;
        color: var(--gray);
        width: 56px;
      }
      .lb-rank.top-3 {
        color: var(--orange);
        font-weight: 700;
      }
      .lb-score {
        font-family: "Orbitron", sans-serif;
        font-weight: 700;
        color: var(--orange2);
        text-align: right;
      }

      .lb-empty {
        text-align: center;
        color: var(--gray);
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        padding: 40px 0;
      }

      .lb-buttons {
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .lb-buttons + .lb-buttons {
        margin-top: 22px;
      }
    </style>
  </head>
  <body>
    <!-- ══ HOME ══ -->
    <div id="page-home" class="page active">
      <div class="home-logo">
        <img src="theunlockedweb.png" alt="67 Racer logo" />
      </div>
      <div class="home-sub">67 RACER</div>
      <p class="home-tagline">
        Can you get the highest spot on the leaderboard?
      </p>
      <input
        type="text"
        id="username-input"
        placeholder="PLEASE TYPE YOUR NAME!"
        maxlength="21"
        autocomplete="off"
        spellcheck="false"
      />
      <div class="home-buttons">
        <button class="btn" id="start-btn">▶ START GAME</button>
        <button class="btn secondary" id="home-lb-btn">LEADERBOARD</button>
      </div>
      <div class="home-rule"></div>
    </div>

    <!-- ══ GAME ══ -->
    <div id="page-game" class="page">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="hand-canvas"></canvas>
      <div id="loading-screen">
        <div class="loader-text">LOADING POSE TRACKING…</div>
        <div class="loader-bar"></div>
      </div>

      <div id="game-hud">
        <div class="hud-block" id="hud-timer">
          <div class="hud-label">TIME</div>
          <div class="hud-value" id="hud-timer-val">20</div>
        </div>
        <div class="hud-block" id="hud-count">
          <div class="hud-label">67s</div>
          <div class="hud-value" id="hud-count-val">0</div>
        </div>
      </div>

      <div id="countdown-overlay">
        <span id="countdown-num">3</span>
      </div>
    </div>

    <!-- ══ RESULTS ══ -->
    <div id="page-results" class="page">
      <p class="results-header">ROUND COMPLETE</p>
      <div class="results-score-block">
        <div class="results-score-big" id="res-score">0</div>
        <div class="results-score-label" id="res-average">
          Average: 0.00 per second
        </div>
      </div>
      <div class="results-rank-badge">
        <span class="rank-label">YOUR RANK</span>
        <span class="rank-value" id="res-rank">#1</span>
      </div>
      <div class="chart-container">
        <div class="chart-title">67s per second</div>
        <canvas id="results-chart" height="160"></canvas>
      </div>
      <div class="results-buttons">
        <button class="btn" id="res-play-btn">▶ PLAY AGAIN</button>
        <button class="btn secondary" id="res-lb-btn">LEADERBOARD</button>
      </div>
    </div>

    <!-- ══ LEADERBOARD ══ -->
    <div id="page-leaderboard" class="page">
      <div class="lb-header">LEADERBOARD</div>
      <table class="lb-table">
        <thead>
          <tr>
            <th class="lb-rank">#</th>
            <th>PLAYER</th>
            <th style="text-align: right">SCORE</th>
          </tr>
        </thead>
        <tbody id="lb-body"></tbody>
      </table>
      <div class="lb-buttons">
        <button class="btn secondary" id="lb-clear-btn">CLEAR</button>
        <button class="btn secondary" id="lb-download-btn">DOWNLOAD CSV</button>
        <button class="btn secondary" id="lb-upload-btn">UPLOAD CSV</button>
      </div>
      <div class="lb-buttons">
        <button class="btn" id="lb-play-btn">▶ PLAY</button>
        <button class="btn secondary" id="lb-back-btn">← BACK</button>
      </div>
    </div>
    <input
      id="lb-upload-input"
      type="file"
      accept=".csv,text/csv"
      style="display: none"
    />

    <script>
      // ═══════════════════════════════════════════════════════
      //  STATE
      // ═══════════════════════════════════════════════════════
      let currentPage = "home";
      let prevPage = "home";
      let username = "";
      let gameState = "idle"; // 'idle' | 'countdown' | 'playing' | 'done'
      let count = 0;
      let timeLeft = 20;
      let countsBySecond = [];
      let lastSecondCount = 0;
      let lastHandAbove = null; // null | 0 | 1  (index of the higher hand)
      let gameTimer = null;
      let chartInstance = null;
      let handPositions = []; // [{x, y, z}, ...]

      const SWAP_THRESHOLD = 0.09; // fraction of normalized coords
      const MIN_WRIST_VISIBILITY = 0.7;
      const MIN_BODY_SIZE = 0.08;

      // ═══════════════════════════════════════════════════════
      //  ROUTING
      // ═══════════════════════════════════════════════════════
      function showPage(id) {
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.remove("active"));
        document.getElementById("page-" + id).classList.add("active");
        currentPage = id;
      }

      // ═══════════════════════════════════════════════════════
      //  LEADERBOARD (localStorage)
      // ═══════════════════════════════════════════════════════
      const LB_KEY = "sixtySeven_lb_v1";

      function loadLeaderboard() {
        try {
          return JSON.parse(localStorage.getItem(LB_KEY)) || [];
        } catch {
          return [];
        }
      }

      function saveScore(name, score) {
        const lb = loadLeaderboard();
        lb.push({ name, score, date: new Date().toISOString().slice(0, 10) });
        lb.sort((a, b) => b.score - a.score);
        const trimmed = lb.slice(0, 50);
        localStorage.setItem(LB_KEY, JSON.stringify(trimmed));
        return trimmed;
      }

      function saveLeaderboardData(lb) {
        const trimmed = lb
          .filter((entry) => entry && entry.name)
          .map((entry) => ({
            name: String(entry.name),
            score: Number(entry.score) || 0,
            date: entry.date || new Date().toISOString().slice(0, 10),
          }))
          .sort((a, b) => b.score - a.score)
          .slice(0, 50);
        localStorage.setItem(LB_KEY, JSON.stringify(trimmed));
        return trimmed;
      }

      function clearLeaderboard() {
        localStorage.removeItem(LB_KEY);
        renderLeaderboard();
      }

      function csvEscape(value) {
        const text = String(value ?? "");
        if (/[",\n\r]/.test(text)) {
          return `"${text.replace(/"/g, '""')}"`;
        }
        return text;
      }

      function leaderboardToCsv(lb) {
        const header = ["name", "score", "date"];
        const rows = [header].concat(
          lb.map((entry) => [entry.name, entry.score, entry.date]),
        );
        return rows.map((row) => row.map(csvEscape).join(",")).join("\r\n");
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let value = "";
        let inQuotes = false;

        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          const next = text[i + 1];

          if (inQuotes) {
            if (char === '"') {
              if (next === '"') {
                value += '"';
                i += 1;
              } else {
                inQuotes = false;
              }
            } else {
              value += char;
            }
          } else if (char === '"') {
            inQuotes = true;
          } else if (char === ",") {
            row.push(value);
            value = "";
          } else if (char === "\r") {
            continue;
          } else if (char === "\n") {
            row.push(value);
            rows.push(row);
            row = [];
            value = "";
          } else {
            value += char;
          }
        }

        if (value !== "" || row.length) {
          row.push(value);
          rows.push(row);
        }

        return rows;
      }

      function loadLeaderboardFromCsv(text) {
        const rows = parseCsv(text).filter((row) => row.length > 0);
        if (!rows.length) return [];

        const headerRow = rows[0].map((value) =>
          String(value).trim().toLowerCase(),
        );
        const nameIndex = headerRow.indexOf("name");
        const scoreIndex = headerRow.indexOf("score");
        const dateIndex = headerRow.indexOf("date");

        if (nameIndex === -1 || scoreIndex === -1 || dateIndex === -1) {
          throw new Error("CSV must include name, score, and date columns.");
        }

        return rows.slice(1).reduce((acc, row) => {
          const name = String(row[nameIndex] ?? "").trim();
          const score = Number(row[scoreIndex]);
          const date = String(row[dateIndex] ?? "").trim();

          if (!name || Number.isNaN(score)) return acc;
          acc.push({
            name,
            score,
            date: date || new Date().toISOString().slice(0, 10),
          });
          return acc;
        }, []);
      }

      function downloadLeaderboardCsv() {
        const lb = loadLeaderboard();
        if (!lb.length) {
          alert("Leaderboard is empty.");
          return;
        }
        const csv = leaderboardToCsv(lb);
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = getCsvFileName();
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
        URL.revokeObjectURL(url);
      }

      function uploadLeaderboardCsvFile(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const imported = loadLeaderboardFromCsv(reader.result || "");
            if (!imported.length) {
              alert("No valid rows found in the CSV.");
              return;
            }
            saveLeaderboardData(imported);
            renderLeaderboard();
            alert("Leaderboard imported successfully.");
          } catch (error) {
            alert(error.message || "Failed to import CSV.");
          }
        };
        reader.onerror = () => {
          alert("Unable to read the selected file.");
        };
        reader.readAsText(file, "UTF-8");
      }

      function getCsvFileName() {
        const date = new Date();
        return `leaderboard-${date.toISOString().slice(0, 10)}.csv`;
      }

      function openLeaderboardUpload() {
        const input = document.getElementById("lb-upload-input");
        input.value = "";
        input.click();
      }

      function handleLeaderboardUploadChange(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        uploadLeaderboardCsvFile(file);
      }

      function getRank(lb, score) {
        const pos = lb.findIndex((e) => e.score === score);
        return pos === -1 ? lb.length : pos + 1;
      }

      function renderLeaderboard() {
        const lb = loadLeaderboard();
        const tbody = document.getElementById("lb-body");
        if (!lb.length) {
          tbody.innerHTML = `<tr><td colspan="3" class="lb-empty">NO SCORES YET — BE FIRST</td></tr>`;
          return;
        }
        tbody.innerHTML = lb
          .slice(0, 20)
          .map(
            (e, i) => `
      <tr>
        <td class="lb-rank ${i < 3 ? "top-3" : ""}">${i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `#${i + 1}`}</td>
        <td>${escHtml(e.name)}</td>
        <td class="lb-score">${e.score}</td>
      </tr>`,
          )
          .join("");
      }

      function escHtml(str) {
        return str.replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      // ═══════════════════════════════════════════════════════
      //  MEDIAPIPE
      // ═══════════════════════════════════════════════════════
      const videoEl = document.getElementById("webcam");
      const canvasEl = document.getElementById("hand-canvas");
      const ctx2d = canvasEl.getContext("2d");

      let poseModel = null;
      let mpCameraObj = null;

      function resizeCanvas() {
        canvasEl.width = videoEl.videoWidth || window.innerWidth;
        canvasEl.height = videoEl.videoHeight || window.innerHeight;
      }

      function getBoundingBox(points) {
        const xs = points.map((p) => p.x);
        const ys = points.map((p) => p.y);
        return {
          minX: Math.min(...xs),
          maxX: Math.max(...xs),
          minY: Math.min(...ys),
          maxY: Math.max(...ys),
          width: Math.max(...xs) - Math.min(...xs),
          height: Math.max(...ys) - Math.min(...ys),
        };
      }

      function isLargePerson(landmarks) {
        const bodyKeys = [0, 11, 12, 13, 14, 23, 24];
        const points = bodyKeys
          .map((index) => landmarks[index])
          .filter(Boolean)
          .filter((point) => point.visibility > MIN_WRIST_VISIBILITY);

        if (points.length < 5) return false;

        const box = getBoundingBox(points);
        return box.width * box.height >= MIN_BODY_SIZE;
      }

      function isHandConnected(wrist, elbow, shoulder) {
        return (
          wrist &&
          elbow &&
          shoulder &&
          wrist.visibility > MIN_WRIST_VISIBILITY &&
          elbow.visibility > MIN_WRIST_VISIBILITY &&
          shoulder.visibility > MIN_WRIST_VISIBILITY &&
          Math.abs(wrist.x - elbow.x) < 0.2 &&
          Math.abs(elbow.x - shoulder.x) < 0.25
        );
      }

      async function initMediaPipe() {
        if (poseModel && mpCameraObj) return; // already running

        if (!poseModel) {
          poseModel = new Pose({
            locateFile: (f) =>
              `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`,
          });
          poseModel.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.65,
          });
          poseModel.onResults(onPoseResults);
        }

        if (!mpCameraObj) {
          mpCameraObj = new Camera(videoEl, {
            onFrame: async () => {
              if (poseModel) await poseModel.send({ image: videoEl });
            },
            width: 1280,
            height: 720,
            fps: 60,
          });
        }

        await mpCameraObj.start();
        videoEl.addEventListener("loadedmetadata", resizeCanvas);
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();
      }

      function stopCamera() {
        if (mpCameraObj) {
          mpCameraObj.stop();
          mpCameraObj = null;
        }
        if (poseModel) {
          poseModel.close();
          poseModel = null;
        }
        videoEl.srcObject = null;
        videoEl.removeAttribute("src");
        videoEl.removeEventListener("loadedmetadata", resizeCanvas);
        window.removeEventListener("resize", resizeCanvas);
      }

      function onPoseResults(results) {
        // Resize canvas to match actual video output
        const vw = videoEl.clientWidth || window.innerWidth;
        const vh = videoEl.clientHeight || window.innerHeight;
        canvasEl.width = vw;
        canvasEl.height = vh;
        ctx2d.clearRect(0, 0, vw, vh);

        const landmarks = results.poseLandmarks || [];
        const leftShoulder = landmarks[11];
        const rightShoulder = landmarks[12];
        const leftElbow = landmarks[13];
        const rightElbow = landmarks[14];
        const leftWrist = landmarks[15];
        const rightWrist = landmarks[16];
        const isLarge = isLargePerson(landmarks);

        handPositions = [];
        if (isLarge && isHandConnected(leftWrist, leftElbow, leftShoulder)) {
          handPositions.push({ x: leftWrist.x, y: leftWrist.y, side: "left" });
        }
        if (isLarge && isHandConnected(rightWrist, rightElbow, rightShoulder)) {
          handPositions.push({
            x: rightWrist.x,
            y: rightWrist.y,
            side: "right",
          });
        }

        // Draw wrist markers
        handPositions.forEach((pos, idx) => {
          const cx = pos.x * vw;
          const cy = pos.y * vh;
          const color = pos.side === "left" ? "#ff5200" : "#ff8c00";

          ctx2d.beginPath();
          ctx2d.arc(cx, cy, 20, 0, Math.PI * 2);
          ctx2d.strokeStyle = color;
          ctx2d.lineWidth = 2;
          ctx2d.shadowBlur = 24;
          ctx2d.shadowColor = color;
          ctx2d.stroke();
          ctx2d.shadowBlur = 0;

          ctx2d.beginPath();
          ctx2d.arc(cx, cy, 8, 0, Math.PI * 2);
          ctx2d.fillStyle = color;
          ctx2d.shadowBlur = 16;
          ctx2d.shadowColor = color;
          ctx2d.fill();
          ctx2d.shadowBlur = 0;

          if (idx === 1) {
            const p0 = handPositions[0];
            ctx2d.beginPath();
            ctx2d.moveTo(p0.x * vw, p0.y * vh);
            ctx2d.lineTo(cx, cy);
            ctx2d.strokeStyle = "rgba(255,120,0,.35)";
            ctx2d.lineWidth = 1.5;
            ctx2d.setLineDash([6, 8]);
            ctx2d.stroke();
            ctx2d.setLineDash([]);
          }
        });

        // 67 detection — only while playing
        if (gameState === "playing" && handPositions.length === 2) {
          const y0 = handPositions[0].y;
          const y1 = handPositions[1].y;
          const diff = y0 - y1;

          let currentAbove = null;
          if (diff > SWAP_THRESHOLD) currentAbove = 1;
          else if (diff < -SWAP_THRESHOLD) currentAbove = 0;

          if (currentAbove !== null) {
            if (lastHandAbove !== null && lastHandAbove !== currentAbove) {
              count++;
              document.getElementById("hud-count-val").textContent = count;
              triggerFlash();
            }
            lastHandAbove = currentAbove;
          }
        }

        if (results.poseLandmarks) {
          const ls = document.getElementById("loading-screen");
          if (!ls.classList.contains("hidden")) ls.classList.add("hidden");
        }
      }

      function triggerFlash() {
        const countBlock = document.getElementById("hud-count");
        countBlock.classList.remove("flash");
        void countBlock.offsetWidth;
        countBlock.classList.add("flash");
      }

      // ═══════════════════════════════════════════════════════
      //  GAME FLOW
      // ═══════════════════════════════════════════════════════
      async function beginGame() {
        showPage("game");
        document.getElementById("loading-screen").classList.remove("hidden");
        document.getElementById("countdown-overlay").classList.add("hidden");
        document.getElementById("hud-count-val").textContent = "0";
        document.getElementById("hud-timer-val").textContent = "20";
        document.getElementById("hud-timer").classList.remove("warning");

        // Reset state
        count = 0;
        timeLeft = 20;
        countsBySecond = [];
        lastSecondCount = 0;
        lastHandAbove = null;
        gameState = "idle";

        await initMediaPipe();

        // Give a moment for first frame
        setTimeout(() => {
          document.getElementById("loading-screen").classList.add("hidden");
          startCountdown();
        }, 1400);
      }

      function startCountdown() {
        gameState = "countdown";
        const overlay = document.getElementById("countdown-overlay");
        const numEl = document.getElementById("countdown-num");
        overlay.classList.remove("hidden");

        let cd = 3;
        numEl.textContent = cd;

        const iv = setInterval(() => {
          cd--;
          if (cd === 0) {
            numEl.textContent = "GO!";
            clearInterval(iv);
            setTimeout(() => {
              overlay.classList.add("hidden");
              startPlaying();
            }, 600);
          } else {
            // Re-trigger animation
            numEl.style.animation = "none";
            void numEl.offsetWidth;
            numEl.style.animation = "";
            numEl.textContent = cd;
          }
        }, 1000);
      }

      function startPlaying() {
        gameState = "playing";
        timeLeft = 20;

        gameTimer = setInterval(() => {
          // Record this second's count
          countsBySecond.push(count - lastSecondCount);
          lastSecondCount = count;
          timeLeft--;

          document.getElementById("hud-timer-val").textContent = timeLeft;
          if (timeLeft <= 5)
            document.getElementById("hud-timer").classList.add("warning");

          if (timeLeft <= 0) {
            clearInterval(gameTimer);
            gameTimer = null;
            endGame();
          }
        }, 1000);
      }

      function endGame() {
        gameState = "done";
        saveAndShowResults();
      }

      function saveAndShowResults() {
        const lb = saveScore(username, count);
        const rank = getRank(lb, count);

        // Update results page
        document.getElementById("res-score").textContent = count;
        const average =
          countsBySecond.length > 0
            ? countsBySecond.reduce((sum, value) => sum + value, 0) /
              countsBySecond.length
            : 0;
        document.getElementById("res-average").textContent =
          `Average: ${average.toFixed(2)} per second`;
        document.getElementById("res-rank").textContent = "#" + rank;

        showPage("results");
        renderChart();
      }

      // ═══════════════════════════════════════════════════════
      //  CHART
      // ═══════════════════════════════════════════════════════
      function renderChart() {
        if (chartInstance) {
          chartInstance.destroy();
          chartInstance = null;
        }

        const labels = Array.from(
          { length: countsBySecond.length },
          (_, i) => `${i + 1}s`,
        );

        const averageData = (() => {
          const values = [];
          let runningTotal = 0;
          countsBySecond.forEach((value, index) => {
            runningTotal += value;
            values.push(Number((runningTotal / (index + 1)).toFixed(2)));
          });
          return values;
        })();

        const canvas = document.getElementById("results-chart");
        chartInstance = new Chart(canvas.getContext("2d"), {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Per second",
                data: countsBySecond,
                borderColor: "#ff5200",
                backgroundColor: "rgba(255,82,0,.12)",
                fill: true,
                tension: 0.35,
                pointBackgroundColor: "#ff8c00",
                pointBorderColor: "#ff5200",
                pointRadius: 4,
                pointHoverRadius: 7,
                borderWidth: 2.5,
              },
              {
                label: "Average",
                data: averageData,
                borderColor: "#ffffff",
                backgroundColor: "rgba(255,255,255,0)",
                fill: false,
                borderDash: [6, 4],
                tension: 0,
                pointRadius: 0,
                borderWidth: 2,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            animation: { duration: 800, easing: "easeOutQuart" },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: "#111",
                borderColor: "#ff5200",
                borderWidth: 1,
                titleColor: "#ff8c00",
                bodyColor: "#f5f5f5",
                titleFont: { family: "Orbitron", size: 10 },
                bodyFont: { family: "IBM Plex Mono", size: 12 },
                callbacks: {
                  title: (items) => `SECOND ${items[0].label}`,
                  label: (item) => `${item.raw} × 67`,
                },
              },
            },
            scales: {
              y: {
                beginAtZero: true,
                grid: { color: "rgba(255,255,255,.07)" },
                ticks: {
                  color: "#888",
                  font: { family: "IBM Plex Mono", size: 11 },
                  stepSize: 1,
                },
                border: { color: "rgba(255,82,0,.2)" },
              },
              x: {
                grid: { color: "rgba(255,255,255,.07)" },
                ticks: {
                  color: "#888",
                  font: { family: "IBM Plex Mono", size: 10 },
                },
                border: { color: "rgba(255,82,0,.2)" },
              },
            },
          },
        });
      }

      // ═══════════════════════════════════════════════════════
      //  EVENT LISTENERS
      // ═══════════════════════════════════════════════════════

      // Home
      document.getElementById("start-btn").addEventListener("click", () => {
        const val = document.getElementById("username-input").value.trim();
        if (!val) {
          document.getElementById("username-input").focus();
          document.getElementById("username-input").style.borderColor =
            "#ff0000";
          setTimeout(
            () =>
              (document.getElementById("username-input").style.borderColor =
                ""),
            1000,
          );
          return;
        }
        username = val;
        beginGame();
      });

      document
        .getElementById("username-input")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") document.getElementById("start-btn").click();
        });

      document.getElementById("home-lb-btn").addEventListener("click", () => {
        prevPage = "home";
        renderLeaderboard();
        showPage("leaderboard");
      });

      // Results
      document.getElementById("res-play-btn").addEventListener("click", () => {
        beginGame();
      });

      document.getElementById("res-lb-btn").addEventListener("click", () => {
        prevPage = "results";
        renderLeaderboard();
        showPage("leaderboard");
      });

      // Leaderboard
      document.getElementById("lb-clear-btn").addEventListener("click", () => {
        if (confirm("Clear the leaderboard? This cannot be undone.")) {
          clearLeaderboard();
        }
      });

      document
        .getElementById("lb-download-btn")
        .addEventListener("click", () => {
          downloadLeaderboardCsv();
        });

      document.getElementById("lb-upload-btn").addEventListener("click", () => {
        openLeaderboardUpload();
      });

      document
        .getElementById("lb-upload-input")
        .addEventListener("change", handleLeaderboardUploadChange);

      document.getElementById("lb-play-btn").addEventListener("click", () => {
        showPage("home");
      });

      document.getElementById("lb-back-btn").addEventListener("click", () => {
        showPage(prevPage === "results" ? "results" : "home");
      });
    </script>
  </body>
</html>
