<!DOCTYPE html>
<html>
<body style="text-align:center; font-family:sans-serif; padding-top:50px;">
    <h3>Guess the number Daddy :)))))</h3>
    <input type="number" id="g">
    <button onclick="check()">Go</button>
    <p id="m"></p>

    <script>
        let target = Math.floor(Math.random() * 100) + 1;
        function check() {
            let val = document.getElementById('g').value;
            let msg = document.getElementById('m');
            if (val == target) {
                msg.innerHTML = "Correct! <button onclick='location.reload()'>Reset</button>";
                msg.style.color = "green";
            } else {
                msg.innerText = val > target ? "Too high!" : "Too low!";
                msg.style.color = "red";
            }
        }
    </script>
</body>
</html>
