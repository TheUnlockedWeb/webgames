<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe (PyScript)</title>

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>

<h1>Tic Tac Toe</h1>

<!-- IMPORTANT: target container -->
<div id="turtle"></div>

<script type="py" config='{"packages":["pyodide-turtle"]}'>
from pyodide_turtle import *
import random

# Force mount to THIS div (critical)
screen = Screen()
screen._root.id = "turtle"

screen.setup(600, 700)

t = Turtle()
t.speed(0)
t.hideturtle()

current_player = "X"
board = [" "] * 9
game_over = False

centers = {
    0: (-100, 100), 1: (0, 100), 2: (100, 100),
    3: (-100, 0),   4: (0, 0),   5: (100, 0),
    6: (-100, -100),7: (0, -100),8: (100, -100)
}

mode = "bot"
difficulty = 2

def drawBoard():
    t.pensize(3)
    for x in [-50, 50]:
        t.penup(); t.goto(x, 150); t.pendown(); t.goto(x, -150)
    for y in [-50, 50]:
        t.penup(); t.goto(-150, y); t.pendown(); t.goto(150, y)
    t.penup()

def drawX():
    t.pendown()
    t.setheading(45); t.forward(40); t.back(80); t.forward(40)
    t.setheading(135); t.forward(40); t.back(80); t.forward(40)
    t.penup()

def drawO():
    t.penup(); t.forward(35)
    t.setheading(90); t.pendown(); t.circle(35)
    t.penup(); t.setheading(0)

def checkWin():
    wins = [(0,1,2),(3,4,5),(6,7,8),(0,3,6),(1,4,7),(2,5,8),(0,4,8),(2,4,6)]
    for a,b,c in wins:
        if board[a] == board[b] == board[c] and board[a] != " ":
            return True
    return False

def endGame(msg):
    global game_over
    game_over = True
    t.goto(0, 200)
    t.write(msg, align="center", font=("Arial", 24, "bold"))

def botMove():
    global current_player
    empty = [i for i,s in enumerate(board) if s==" "]
    if not empty: return
    move = random.choice(empty)

    board[move] = "O"
    t.goto(centers[move])
    drawO()

    if checkWin():
        endGame("O WINS")
    else:
        current_player = "X"

def click(x,y):
    global current_player
    if game_over: return

    if -150 < x < 150 and -150 < y < 150:
        col = int((x+150)//100)
        row = int((150-y)//100)
        i = row*3+col

        if board[i] == " ":
            board[i] = current_player
            t.goto(centers[i])

            if current_player=="X":
                drawX()

            if checkWin():
                endGame("X WINS")
            else:
                current_player = "O"
                botMove()

drawBoard()
screen.onscreenclick(click)
</script>

</body>
</html>
