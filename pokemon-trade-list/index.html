<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon GO Trade List Generator</title>
  <meta name="description" content="Create and share your Pokémon GO trade lists as images.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="./">TradeList</a>
      <nav>
        <a class="nav-link active" href="./">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
          List Generator
        </a>
      </nav>
    </div>
  </header>

  <main class="page">
    <h1 class="page-title">Trade List Generator</h1>
    <p class="page-sub">Create and share your Pokémon GO trade lists as images</p>

    <div class="toolbar">
      <div class="tb-group">
        <button id="btn-clear" class="tb tb-danger">Clear</button>
        <button id="btn-download" class="tb tb-primary">Download PNG</button>
        <button id="btn-share" class="tb">Share</button>
        <button id="btn-saved" class="tb">Saved Lists</button>
        <button id="btn-trinket" class="tb"><span class="tdot"></span>Trinket</button>
        <button id="btn-note" class="tb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          <span id="btn-note-label">Note</span>
        </button>
      </div>
      <label class="fly-toggle">
        <span>Can Fly</span>
        <span class="switch"><input type="checkbox" id="fly"><i></i></span>
      </label>
    </div>

    <div class="card-wrap"><div id="card" class="card theme-grass"></div></div>
    <p class="tip">Tip: click the title or either section heading on the card to rename it.</p>

    <div class="themes">
      <div class="themes-label">Background Theme</div>
      <div id="theme-list" class="theme-list"></div>
    </div>
  </main>

  <footer class="foot">
    <span>Trade List Generator — Pokémon GO Trading Tool</span>
    <span>Not affiliated with Niantic or The Pokémon Company</span>
  </footer>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- PNG export -->
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <!-- app -->
  <script src="js/ui.js"></script>
  <script src="js/pokeapi.js"></script>
  <script src="js/state.js"></script>
  <script src="js/picker.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
