<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Obstacle Dodge</title>
    <style>
      /* Colors the screen dark and centers your game canvas perfectly */
      body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
      #unity-canvas { width: 960px; height: 600px; background: #231f20; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); }
    </style>
  </head>
  <body>

    <!-- This is the HTML canvas tag where your game draws its graphics -->
    <canvas id="unity-canvas"></canvas>

    <!-- 1. This imports the main loader file Unity generated for you -->
    <script src="Build/Obstacle Dodge.loader.js"></script>

    <script>
      // 2. These paths point exactly to your unique Unity 6 file names
      var config = {
        dataUrl: "Build/Obstacle Dodge.data.unityweb",
        frameworkUrl: "Build/Obstacle Dodge.framework.js.unityweb",
        codeUrl: "Build/Obstacle Dodge.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Obstacle Dodge",
        productVersion: "0.1.0",
      };

      const canvas = document.querySelector("#unity-canvas");
      
      // 3. This initializes and launches the Unity engine on the webpage
      createUnityInstance(canvas, config, (progress) => {
        console.log("Loading progress: " + Math.round(100 * progress) + "%");
      }).then((unityInstance) => {
        console.log("Game successfully loaded inside your subfolder!");
      }).catch((error) => {
        console.error("Failed to load Unity game:", error);
      });
    </script>

  </body>
</html>
